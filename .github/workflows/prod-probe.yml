name: Calix production SQLi probe
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: UTC run identifier
        required: true
        default: 2026-11-20T2250Z_prod_github_probe
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: python3 scripts/prod_probe.py
      - name: Commit evidence
        run: |
          git config user.name 'Calix assessment runner'
          git config user.email 'calix-assessment@users.noreply.github.com'
          git add runs/${{ inputs.run_id }}
          git commit -m "Probe ${{ inputs.run_id }}"
          git push
